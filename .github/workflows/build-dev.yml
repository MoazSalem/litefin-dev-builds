# ==============================================================================
# Litefin Multi-Platform Automated Dev Build Pipeline
# ==============================================================================
# Triggered by 'repository_dispatch' from the main litefin repository on every
# commit to the 'development' branch (ignoring chore: commits).
#
# Packages Compiled & Released in Real-Time:
# - TV Packages & Jellyfin Plugin (Tizen .wgt, webOS .ipk, Web Client Plugin .zip)
# - Desktop Packages (Windows .exe/.msi, Linux .deb/.AppImage/.rpm, macOS .dmg)
# - Mobile Packages (Android split ABIs & Universal .apk/.aab)
#
# Each platform attaches its compiled binaries to the GitHub Release immediately
# upon completion so files appear live without waiting for other jobs to finish.
# ==============================================================================

name: Build Litefin Dev Release

on:
  repository_dispatch:
    types: [ build_dev_commit ]
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Target commit SHA from MoazSalem/litefin (default: development HEAD)'
        required: false
        default: 'development'
      short_sha:
        description: 'Short 7-char SHA identifier for labeling artifacts'
        required: false
        default: 'manual'

permissions:
  contents: write

jobs:
  # ============================================================================
  # Job 1: Initialize Release Shell (Marked as Latest)
  # ============================================================================
  create-release:
    name: Initialize Dev Release
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.init.outputs.tag_name }}
      short_sha: ${{ steps.init.outputs.short_sha }}
      commit_sha: ${{ steps.init.outputs.commit_sha }}

    steps:
      - name: Checkout Build Repo
        uses: actions/checkout@v4

      - name: Create GitHub Release Record
        id: init
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_SHA="${{ github.event.client_payload.sha || inputs.target_sha || 'development' }}"
          SHORT_SHA="${{ github.event.client_payload.short_sha || inputs.short_sha || 'dev' }}"
          RUN_NUM="${{ github.run_number }}"
          TAG_NAME="dev-b${RUN_NUM}-${SHORT_SHA}"
          TITLE="Litefin Dev Build #${RUN_NUM} (${SHORT_SHA})"
          MSG="${{ github.event.client_payload.message || 'Manual build run' }}"
          AUTHOR="${{ github.event.client_payload.author || github.actor }}"
          REF="${{ github.event.client_payload.ref || 'development' }}"

          echo "commit_sha=${TARGET_SHA}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

          BODY=$(cat <<EOF
          ## Automated Litefin Development Build

          - **Source Commit:** [\`${SHORT_SHA}\`](https://github.com/MoazSalem/litefin/commit/${TARGET_SHA})
          - **Commit Message:** ${MSG}
          - **Pushed by:** @${AUTHOR}
          - **Target Branch:** \`${REF}\`
          - **Build Pipeline Run:** #${RUN_NUM}

          ---
          *Artifacts are compiled and attached below automatically as each platform finishes.*
          EOF
          )

          # Delete existing tag/release if it was partially left from a retry
          gh release delete "$TAG_NAME" --yes 2>/dev/null || true
          git tag -d "$TAG_NAME" 2>/dev/null || true

          # Initialize the Release and mark it as Latest
          gh release create "$TAG_NAME" \
            --title "$TITLE" \
            --notes "$BODY" \
            --latest \
            --target main

  # ============================================================================
  # Job 2: Build TV Packages & Jellyfin Web Client Plugin
  # ============================================================================
  build-tv:
    name: TV Packages & Web Client Plugin
    needs: [ create-release ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4
        with:
          repository: MoazSalem/litefin
          ref: ${{ needs.create-release.outputs.commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.BUILD_TRIGGER_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup .NET SDK (Required for Jellyfin Plugin)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Dependencies
        run: npm install

      - name: Create Signing Directory
        run: mkdir -p .sign

      - name: Build Tizen & webOS Packages
        run: npm run package

      - name: Build Litefin Web Client Server Plugin
        run: npm run package:plugin
        env:
          TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
          IS_BETA: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Brand TV Packages with Short SHA
        run: |
          SHORT="${{ needs.create-release.outputs.short_sha }}"
          for f in *.wgt *.ipk; do
            [ -f "$f" ] || continue
            filename="${f%.*}"
            ext="${f##*.}"
            mv "$f" "${filename}-${SHORT}.${ext}"
          done

      - name: Upload TV & Plugin Artifacts Directly to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: |
            *.wgt
            *.ipk
            manifest.json
            Litefin.*.Plugin*.zip
            litefin-plugin-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # Job 3: Desktop Compilation Matrix (Windows, Linux, macOS)
  # ============================================================================
  build-desktop:
    name: Desktop (${{ matrix.platform.name }})
    needs: [ create-release ]
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            os: windows-latest
            script: npm run package:windows
            artifacts: |
              Litefin-*.exe
              Litefin_*_setup*.exe
              Litefin_*.msi

          - name: Linux
            os: ubuntu-latest
            script: npm run package:linux
            artifacts: |
              *.deb
              *.AppImage
              *.rpm

          - name: macOS
            os: macos-latest
            script: npm run package:macos
            artifacts: |
              *.dmg

    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4
        with:
          repository: MoazSalem/litefin
          ref: ${{ needs.create-release.outputs.commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.BUILD_TRIGGER_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build Artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Configure Linux APT Environment
        if: runner.os == 'Linux'
        run: |
          # Force IPv4 to prevent Azure IPv6 mirror connection timeouts
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
          # Preserve downloaded .debs in /var/cache/apt/archives for caching
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/01keep-debs
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee -a /etc/apt/apt.conf.d/01keep-debs
          sudo chown -R runner:runner /var/cache/apt/archives

      - name: Cache APT Package Archives
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-tauri-linux-deps-v1

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-tools
          sudo apt-get install -y libayatana-appindicator3-dev || sudo apt-get install -y libappindicator3-dev
          sudo chown -R runner:runner /var/cache/apt/archives || true
          sudo chmod -R 777 /var/cache/apt/archives || true

      - name: Install Project Dependencies
        run: npm install

      - name: Compile and Package Desktop Binary
        run: ${{ matrix.platform.script }}

      - name: Brand Artifacts with Short SHA (Bash / Linux & macOS)
        if: runner.os != 'Windows'
        run: |
          SHORT="${{ needs.create-release.outputs.short_sha }}"
          for f in *.exe *.msi *.deb *.AppImage *.rpm *.dmg; do
            [ -f "$f" ] || continue
            filename="${f%.*}"
            ext="${f##*.}"
            mv "$f" "${filename}-${SHORT}.${ext}"
          done

      - name: Brand Artifacts with Short SHA (PowerShell / Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $short = "${{ needs.create-release.outputs.short_sha }}"
          Get-ChildItem -File -Include *.exe, *.msi | ForEach-Object {
            $base = $_.BaseName
            $ext = $_.Extension
            $newName = "${base}-${short}${ext}"
            Rename-Item -Path $_.FullName -NewName $newName
          }

      - name: Upload Desktop Artifacts Directly to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: ${{ matrix.platform.artifacts }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # Job 4: Mobile Compilation (Android Split ABIs & Universal)
  # ============================================================================
  build-android:
    name: Android (Split & Universal APKs)
    needs: [ create-release ]
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4
        with:
          repository: MoazSalem/litefin
          ref: ${{ needs.create-release.outputs.commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.BUILD_TRIGGER_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK and NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          if [ -d "$ANDROID_HOME/ndk" ]; then
            ANDROID_NDK_ROOT=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          fi
          if [ -z "$ANDROID_NDK_ROOT" ] || [ ! -d "$ANDROID_NDK_ROOT" ]; then
            echo "Installing NDK via sdkmanager..."
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264"
            ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/26.3.11579264"
          fi
          echo "NDK_HOME=$ANDROID_NDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Rust with Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust Build Artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Project Dependencies
        run: npm install

      # ------------------------------------------------------------------------
      # Configure Android Signing Keystore (Official Key or Auto-Generated Dev Key)
      # ------------------------------------------------------------------------
      - name: Configure Android Signing Keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Configuring official release signing keystore from secrets..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > src-tauri/gen/android/New_Keystore.jks
            cat <<EOF > src-tauri/gen/android/keystore.properties
            storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
            keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
            keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
            storeFile=New_Keystore.jks
            EOF
          else
            echo "No keystore secrets configured in build repo. Generating automatic development keystore..."
            keytool -genkey -v \
              -keystore src-tauri/gen/android/New_Keystore.jks \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=LitefinDev,O=Litefin,C=US"

            cat <<EOF > src-tauri/gen/android/keystore.properties
            storePassword=android
            keyPassword=android
            keyAlias=androiddebugkey
            storeFile=New_Keystore.jks
            EOF
          fi
          echo "Android signing configuration generated successfully."

      - name: Compile Android ABI-Split APKs
        run: npm run package:android

      - name: Compile Android Universal APK
        run: npm run package:android-universal

      - name: Brand Artifacts with Short SHA
        run: |
          SHORT="${{ needs.create-release.outputs.short_sha }}"
          for f in *.apk *.aab; do
            [ -f "$f" ] || continue
            filename="${f%.*}"
            ext="${f##*.}"
            mv "$f" "${filename}-${SHORT}.${ext}"
          done

      - name: Upload Android APKs Directly to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: |
            *.apk
            *.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
