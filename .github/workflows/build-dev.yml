# ==============================================================================
# Litefin Multi-Platform Automated Dev Build Pipeline
# ==============================================================================
# Triggered by 'repository_dispatch' from the main litefin repository on every
# commit to the 'development' branch (ignoring chore: commits).
#
# Packages Compiled & Released:
# - TV Packages:
#     - Samsung Tizen (.wgt)
#     - LG webOS (.ipk)
#     - Jellyfin Server Companion Plugin (.zip)
# - Desktop Packages:
#     - Windows: Portable .exe, Setup Installer (.exe), and .msi
#     - Linux:   Portable AppImage, Debian package (.deb), and .rpm
#     - macOS:   Apple Disk Image (.dmg)
# - Mobile Packages:
#     - Android: Split ABI APKs (arm64, arm, x86, x86_64) & Universal APK (.apk)
# ==============================================================================

name: Build Litefin Dev Release

on:
  repository_dispatch:
    types: [ build_dev_commit ]
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Target commit SHA from MoazSalem/litefin (default: development HEAD)'
        required: false
        default: 'development'
      short_sha:
        description: 'Short 7-char SHA identifier for labeling artifacts'
        required: false
        default: 'manual'

permissions:
  contents: write

jobs:
  # ============================================================================
  # Job 1: Prepare Build Metadata
  # ============================================================================
  prepare:
    name: Prepare Build Metadata
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.init.outputs.tag_name }}
      short_sha: ${{ steps.init.outputs.short_sha }}
      commit_sha: ${{ steps.init.outputs.commit_sha }}
      release_title: ${{ steps.init.outputs.release_title }}
      commit_msg: ${{ steps.init.outputs.commit_msg }}
      commit_author: ${{ steps.init.outputs.commit_author }}
      target_ref: ${{ steps.init.outputs.target_ref }}

    steps:
      - name: Compute Target Metadata
        id: init
        run: |
          TARGET_SHA="${{ github.event.client_payload.sha || inputs.target_sha || 'development' }}"
          SHORT_SHA="${{ github.event.client_payload.short_sha || inputs.short_sha || 'dev' }}"
          RUN_NUM="${{ github.run_number }}"
          TAG_NAME="dev-b${RUN_NUM}-${SHORT_SHA}"
          TITLE="Litefin Dev Build #${RUN_NUM} (${SHORT_SHA})"
          MSG="${{ github.event.client_payload.message || 'Manual build run' }}"
          AUTHOR="${{ github.event.client_payload.author || github.actor }}"
          REF="${{ github.event.client_payload.ref || 'development' }}"

          echo "commit_sha=${TARGET_SHA}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_title=${TITLE}" >> $GITHUB_OUTPUT
          echo "commit_msg=${MSG}" >> $GITHUB_OUTPUT
          echo "commit_author=${AUTHOR}" >> $GITHUB_OUTPUT
          echo "target_ref=${REF}" >> $GITHUB_OUTPUT

  # ============================================================================
  # Job 2: Build TV Packages (Samsung Tizen, LG webOS, Jellyfin Plugin)
  # ============================================================================
  build-tv:
    name: TV Packages (Tizen & webOS)
    needs: [ prepare ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4
        with:
          repository: MoazSalem/litefin
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.BUILD_TRIGGER_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup .NET SDK (For Jellyfin Plugin)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Dependencies
        run: npm install

      - name: Create Signing Directory
        run: mkdir -p .sign

      - name: Build Tizen & webOS Packages
        run: npm run package

      - name: Build Litefin Server Plugin
        run: npm run package:plugin || true

      - name: Brand Artifacts with Short SHA
        run: |
          SHORT="${{ needs.prepare.outputs.short_sha }}"
          mkdir -p tv-dist
          for f in *.wgt *.ipk Litefin.*.Plugin*.zip manifest.json litefin-plugin-manifest.json; do
            [ -f "$f" ] || continue
            filename="${f%.*}"
            ext="${f##*.}"
            mv "$f" "tv-dist/${filename}-${SHORT}.${ext}"
          done

      - name: Upload TV Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tv-packages
          path: tv-dist/*

  # ============================================================================
  # Job 3: Desktop Compilation Matrix (Windows, Linux, macOS)
  # ============================================================================
  build-desktop:
    name: Desktop (${{ matrix.platform.name }})
    needs: [ prepare ]
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            os: windows-latest
            script: npm run package:windows

          - name: Linux
            os: ubuntu-latest
            script: npm run package:linux

          - name: macOS
            os: macos-latest
            script: npm run package:macos

    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4
        with:
          repository: MoazSalem/litefin
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.BUILD_TRIGGER_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build Artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Configure Linux APT Environment
        if: runner.os == 'Linux'
        run: |
          # Force IPv4 to prevent Azure IPv6 mirror connection timeouts
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
          # Preserve downloaded .debs in /var/cache/apt/archives for caching
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/01keep-debs
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee -a /etc/apt/apt.conf.d/01keep-debs
          # Ensure runner user has write permissions for cache actions
          sudo chown -R runner:runner /var/cache/apt/archives

      - name: Cache APT Package Archives
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-tauri-linux-deps-v1

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-tools
          sudo apt-get install -y libayatana-appindicator3-dev || sudo apt-get install -y libappindicator3-dev
          sudo chown -R runner:runner /var/cache/apt/archives || true
          sudo chmod -R 777 /var/cache/apt/archives || true

      - name: Install Project Dependencies
        run: npm install

      - name: Compile and Package Desktop Binary
        run: ${{ matrix.platform.script }}

      - name: Brand Artifacts with Short SHA (Bash / Linux & macOS)
        if: runner.os != 'Windows'
        run: |
          SHORT="${{ needs.prepare.outputs.short_sha }}"
          mkdir -p desktop-dist
          for f in *.exe *.msi *.deb *.AppImage *.rpm *.dmg; do
            [ -f "$f" ] || continue
            filename="${f%.*}"
            ext="${f##*.}"
            mv "$f" "desktop-dist/${filename}-${SHORT}.${ext}"
          done

      - name: Brand Artifacts with Short SHA (PowerShell / Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $short = "${{ needs.prepare.outputs.short_sha }}"
          New-Item -ItemType Directory -Force -Path desktop-dist | Out-Null
          Get-ChildItem -File -Include *.exe, *.msi | ForEach-Object {
            $base = $_.BaseName
            $ext = $_.Extension
            $newName = "${base}-${short}${ext}"
            Move-Item -Path $_.FullName -Destination "desktop-dist/$newName"
          }

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform.name }}
          path: desktop-dist/*

  # ============================================================================
  # Job 4: Mobile Compilation (Android Split ABIs & Universal)
  # ============================================================================
  build-android:
    name: Android (Split & Universal APKs)
    needs: [ prepare ]
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4
        with:
          repository: MoazSalem/litefin
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.BUILD_TRIGGER_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK and NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          if [ -d "$ANDROID_HOME/ndk" ]; then
            ANDROID_NDK_ROOT=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          fi
          if [ -z "$ANDROID_NDK_ROOT" ] || [ ! -d "$ANDROID_NDK_ROOT" ]; then
            echo "Installing NDK via sdkmanager..."
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264"
            ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/26.3.11579264"
          fi
          echo "NDK_HOME=$ANDROID_NDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Rust with Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust Build Artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Project Dependencies
        run: npm install

      - name: Compile Android ABI-Split APKs
        run: npm run package:android

      - name: Compile Android Universal APK
        run: npm run package:android-universal

      - name: Brand Artifacts with Short SHA
        run: |
          SHORT="${{ needs.prepare.outputs.short_sha }}"
          mkdir -p android-dist
          for f in *.apk *.aab; do
            [ -f "$f" ] || continue
            filename="${f%.*}"
            ext="${f##*.}"
            mv "$f" "android-dist/${filename}-${SHORT}.${ext}"
          done

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: android-dist/*

  # ============================================================================
  # Job 5: Publish Full GitHub Release with All Attached Artifacts
  # ============================================================================
  publish-release:
    name: Publish Official GitHub Release
    needs: [ prepare, build-tv, build-desktop, build-android ]
    if: always() && !cancelled() && !contains(needs.prepare.result, 'failure')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Build Repo
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: raw-artifacts

      - name: Consolidate Release Binaries
        run: |
          mkdir -p release-files
          # Move all downloaded artifact files from subdirectories into release-files
          find raw-artifacts -type f -exec cp {} release-files/ \;
          echo "Prepared binaries for release:"
          ls -la release-files/

      - name: Publish GitHub Pre-Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prepare.outputs.tag_name }}"
          TITLE="${{ needs.prepare.outputs.release_title }}"
          COMMIT_SHA="${{ needs.prepare.outputs.commit_sha }}"
          SHORT_SHA="${{ needs.prepare.outputs.short_sha }}"
          MSG="${{ needs.prepare.outputs.commit_msg }}"
          AUTHOR="${{ needs.prepare.outputs.commit_author }}"
          REF="${{ needs.prepare.outputs.target_ref }}"

          BODY=$(cat <<EOF
          ## Automated Litefin Development Build

          - **Source Commit:** [\`${SHORT_SHA}\`](https://github.com/MoazSalem/litefin/commit/${COMMIT_SHA})
          - **Commit Message:** ${MSG}
          - **Pushed by:** @${AUTHOR}
          - **Target Branch:** \`${REF}\`
          - **Build Pipeline Run:** #${{ github.run_number }}

          All packages (TV, Desktop, and Android) are compiled and attached below.
          EOF
          )

          # Delete existing tag/release if it was partially left from a previous step
          gh release delete "$TAG" --yes || true
          git tag -d "$TAG" 2>/dev/null || true

          # Create full GitHub Release attached to the 'main' branch of litefin-dev-builds
          gh release create "$TAG" release-files/* \
            --title "$TITLE" \
            --notes "$BODY" \
            --prerelease \
            --latest \
            --target main
